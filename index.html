<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Advisor</title>
<style>
:root {
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f1f0ec; --ink:#0b0b0b; --ink-2:#52514e; --muted:#7a7873;
  --border:rgba(11,11,11,.10); --border-strong:rgba(11,11,11,.18); --accent:#2a78d6;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --up:#006300; --down:#c03030;
  --good-wash:rgba(12,163,12,.12); --crit-wash:rgba(208,59,59,.12); --warn-wash:rgba(250,178,25,.18); --neutral-wash:rgba(11,11,11,.06);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04); --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  color-scheme: dark; --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --ink:#fff; --ink-2:#c3c2b7; --muted:#9a988f;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.20); --accent:#3987e5; --up:#2fbf2f; --down:#ef7070;
  --good-wash:rgba(12,163,12,.2); --crit-wash:rgba(208,59,59,.22); --warn-wash:rgba(250,178,25,.18); --neutral-wash:rgba(255,255,255,.08); --shadow:none; } }
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--accent)} h1,h2,h3{margin:0;line-height:1.25;font-weight:600} h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
p{margin:0 0 8px} .muted{color:var(--ink-2)} .small{font-size:12.5px} .up{color:var(--up)} .down{color:var(--down)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 48px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 0 12px;border-bottom:1px solid var(--border);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:32px;height:32px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none} .dot.live{background:var(--good)} .dot.warn{background:var(--warn)} .dot.err{background:var(--crit)}
select,button{font:inherit;color:inherit}
select{padding:5px 8px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);max-width:100%}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)} .btn.sm{padding:3px 9px;font-size:12.5px} .btn.ghost{border-color:transparent;background:transparent}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card-head p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;border:1px solid transparent}
.banner.high{background:var(--crit-wash)} .banner.medium{background:var(--warn-wash)} .banner.info{background:var(--neutral-wash)}
.banner .grow{flex:1;min-width:0} .banner strong{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--neutral-wash);white-space:nowrap}
.chip.buy,.chip.add,.chip.positive{background:var(--good-wash)} .chip.sell,.chip.avoid,.chip.negative{background:var(--crit-wash)} .chip.trim,.chip.watch,.chip.review,.chip.mixed,.chip.check{background:var(--warn-wash)}
.conv{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px} .conv i{width:8px;height:8px;border-radius:50%;background:var(--border-strong)} .conv i.on{background:var(--accent)}
.pick{display:flex;flex-direction:column;gap:8px}
.pick .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pick .sym{font-size:19px;font-weight:700} .pick .px{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px} .kv dt{color:var(--ink-2)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
ul.reasons{margin:0;padding-left:18px} ul.reasons li{margin:2px 0}
.risk{color:var(--ink-2);font-size:13px} .risk b{color:var(--down);font-weight:600}
.ind{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink-2)} .ind b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.news a{font-size:13px} .news li{margin:2px 0} .news{margin:0;padding-left:18px}
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse} th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top}
th{font-size:12px;font-weight:500;color:var(--ink-2)} td{font-variant-numeric:tabular-nums} td.r,th.r{text-align:right} td.wrap{white-space:normal;min-width:240px}
tbody tr:last-child td{border-bottom:0}
.todo{list-style:none;margin:0;padding:0} .todo li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--border)} .todo li:last-child{border-bottom:0}
.todo input{margin-top:4px} .todo label{cursor:pointer} .todo .done{text-decoration:line-through;color:var(--muted)}
.flash{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)} .flash:last-child{border-bottom:0}
.flash .sym{font-weight:700;min-width:64px}
.events{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.empty{padding:22px;text-align:center;color:var(--ink-2)}
details summary{cursor:pointer;color:var(--ink-2);font-size:13.5px}
.disclaimer{font-size:12px;color:var(--muted);margin-top:28px}
.loading{padding:40px;text-align:center;color:var(--ink-2)}
@media (max-width:640px){ .wrap{padding:0 14px 40px} .card{padding:14px} .table-wrap{margin:0 -14px;padding:0 14px} h1{font-size:20px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg></div>
      <div><h1>Market Advisor</h1><div class="small muted" id="sub">Loading the latest brief…</div></div>
    </div>
    <span class="pill" id="market-pill"><span class="dot"></span><span>US market</span></span>
    <span class="pill" id="ai-pill"><span class="dot"></span><span>AI</span></span>
    <label class="small muted">Brief <select id="history" aria-label="Choose a brief"></select></label>
  </header>
  <main id="main"><div class="loading">Loading…</div></main>
  <p class="disclaimer">Research to inform your own decisions, not personalised financial advice. The AI can misread news and the rules are simple; check anything you act on. Past performance doesn't predict future results.</p>
</div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
const money = (v) => isNum(v) ? (v >= 1000 ? '$' + v.toLocaleString('en-US', { maximumFractionDigits: 0 }) : '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: v < 1 ? 4 : 2 })) : '—';
const pct = (v, dp = 1) => isNum(v) ? (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(dp) + '%' : '—';
const tone = (v) => !isNum(v) || Math.abs(v) < 1e-9 ? '' : v > 0 ? 'up' : 'down';
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const ACTION = { buy: 'Buy', watch: 'Watch', avoid: 'Avoid', hold: 'Hold', sell: 'Sell', trim: 'Take profit', add: 'Add', review: 'Review', check: 'Check' };
let current = null;

function repoEditUrl(file) {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const path = location.pathname.split('/').filter(Boolean);
  if (m && path.length) return `https://github.com/${m[1]}/${path[0]}/edit/main/${file}`;
  return null;
}

function chip(kind, label) { return `<span class="chip ${esc(kind)}">${esc(label || ACTION[kind] || kind)}</span>`; }
function conviction(n) { return `<span class="conv" title="Conviction ${n} of 5" aria-label="Conviction ${n} of 5">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`; }

function pickCard(p) {
  const ind = p.indicators || {};
  return `<article class="card pick">
    <div class="head"><span class="sym">${esc(p.symbol)}</span>${chip(p.action)}${conviction(p.conviction || 0)}<span class="px" style="margin-left:auto">${money(p.price)}</span></div>
    <div class="ind"><span>Trend <b>${esc(ind.trend || '—')}</b></span><span>RSI <b>${isNum(ind.rsi) ? Math.round(ind.rsi) : '—'}</b></span><span>Day <b class="${tone(ind.day_pct)}">${pct(ind.day_pct)}</b></span><span>Week <b class="${tone(ind.week_pct)}">${pct(ind.week_pct)}</b></span><span>Month <b class="${tone(ind.month_pct)}">${pct(ind.month_pct)}</b></span></div>
    <dl class="kv"><dt>Stop-loss</dt><dd>${money(p.stop)}${isNum(p.stop) && isNum(p.price) ? ` <span class="muted">(${pct((p.stop / p.price - 1) * 100)})</span>` : ''}</dd>
      ${isNum(p.target) ? `<dt>Target</dt><dd>${money(p.target)} <span class="muted">(${pct((p.target / p.price - 1) * 100)})</span></dd>` : ''}
      <dt>Horizon</dt><dd>${esc(p.horizon || '')}</dd>${p.entry_note ? `<dt>How to enter</dt><dd>${esc(p.entry_note)}</dd>` : ''}</dl>
    <ul class="reasons">${(p.reasons || []).map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
    ${(p.risks || []).length ? `<div class="risk">${p.risks.map((r) => `<div><b>Risk:</b> ${esc(r)}</div>`).join('')}</div>` : ''}
    ${(p.news || []).length ? `<details><summary>News (${p.news.length})</summary><ul class="news">${p.news.map((n) => `<li><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.headline)}</a> <span class="small muted">${esc(n.source)} · ${esc(n.at)}</span></li>`).join('')}</ul></details>` : ''}
  </article>`;
}

function render(r) {
  current = r;
  const local = new Date(r.generated_at.replace(' UTC', 'Z').replace(' ', 'T'));
  $('#sub').textContent = `${r.run[0].toUpperCase() + r.run.slice(1)} brief · ${isNaN(local) ? r.generated_at : local.toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}`;
  const mk = $('#market-pill'); mk.innerHTML = r.market.us_market_open ? '<span class="dot live"></span><span>US market open</span>' : `<span class="dot"></span><span>US market closed${r.market.next_open_et ? ' · opens ' + esc(r.market.next_open_et.slice(5)) + ' ET' : ''}</span>`;
  const ai = $('#ai-pill'); ai.innerHTML = r.ai && r.ai.ok ? `<span class="dot live"></span><span>AI brief · ${esc((r.ai.model || '').split('/').pop())}</span>` : '<span class="dot warn"></span><span>Rules-only brief</span>';
  ai.title = r.ai && r.ai.error ? r.ai.error : '';

  const dismissed = store.get('advisor.dismissed') || [];
  const alerts = (r.alerts || []).filter((a) => !dismissed.includes(a.id));
  const ticks = store.get('advisor.todo.' + r.date_et + '.' + r.run) || [];
  const edit = repoEditUrl('portfolio.json');
  const parts = [];

  if (alerts.length) parts.push(`<section class="stack">${alerts.map((a) => `<div class="banner ${esc(a.severity)}" role="alert"><div class="grow"><strong>${esc(a.title)}</strong> ${esc(a.detail)}${a.action ? ` <span class="muted">→ ${esc(a.action)}</span>` : ''}</div><button class="btn sm ghost" data-dismiss="${esc(a.id)}" aria-label="Dismiss">✕</button></div>`).join('')}</section>`);
  if ((r.notes || []).length) parts.push(`<section class="stack">${r.notes.map((n) => `<div class="banner info"><div class="grow">${esc(n)}</div></div>`).join('')}</section>`);

  parts.push(`<section class="card"><div class="card-head"><div><h2>Today's picture</h2><p>${esc(r.generated_at_et)}</p></div></div><p>${esc(r.market.summary || '')}</p>
    ${(r.market.events || []).length ? `<details><summary>Events being watched (${r.market.events.length})</summary><ul class="events">${r.market.events.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></details>` : ''}
    <div class="ind" style="margin-top:8px">${r.market.spy ? `<span>SPY <b>${money(r.market.spy.price)}</b> <b class="${tone(r.market.spy.d1)}">${pct(r.market.spy.d1)}</b> today, <b class="${tone(r.market.spy.m1)}">${pct(r.market.spy.m1)}</b> month, trend <b>${esc(r.market.spy.trend)}</b></span>` : ''}
    ${r.market.btc ? `<span>BTC <b>${money(r.market.btc.price)}</b> <b class="${tone(r.market.btc.d1)}">${pct(r.market.btc.d1)}</b> today, <b class="${tone(r.market.btc.m1)}">${pct(r.market.btc.m1)}</b> month, trend <b>${esc(r.market.btc.trend)}</b></span>` : ''}</div></section>`);

  if ((r.todo || []).length) parts.push(`<section class="card"><div class="card-head"><h2>To do today</h2></div><ul class="todo">${r.todo.map((t, i) => `<li><input type="checkbox" id="todo${i}" data-todo="${i}" ${ticks.includes(i) ? 'checked' : ''}><label for="todo${i}" class="${ticks.includes(i) ? 'done' : ''}">${esc(t)}</label></li>`).join('')}</ul></section>`);

  const longs = r.picks?.long || [], shorts = r.picks?.short || [];
  parts.push(`<section><div class="card-head"><div><h2>Long-term stock ideas</h2><p>Meant to be held for months. Stop-loss ${esc(r.settings?.long?.stop_pct)}% below entry unless stated.</p></div></div>${longs.length ? `<div class="grid">${longs.map(pickCard).join('')}</div>` : '<div class="card empty">No long-term ideas today.</div>'}</section>`);
  parts.push(`<section><div class="card-head"><div><h2>Short-term crypto ideas</h2><p>Days, not months. Stop ${esc(r.settings?.short?.stop_pct)}%, target ${esc(r.settings?.short?.target_pct)}%, out after ${esc(r.settings?.short?.max_hold_days)} days.</p></div></div>${shorts.length ? `<div class="grid">${shorts.map(pickCard).join('')}</div>` : '<div class="card empty">No short-term ideas today.</div>'}</section>`);
  if ((r.avoid || []).length) parts.push(`<section class="card"><div class="card-head"><h2>Avoid for now</h2></div><ul class="reasons">${r.avoid.map((a) => `<li><b>${esc(a.symbol)}</b>: ${esc(a.why)}</li>`).join('')}</ul></section>`);

  const H = r.holdings || [];
  parts.push(`<section class="card"><div class="card-head"><div><h2>Your holdings</h2><p>${H.length ? 'Checked against your stops, targets and the news' : 'Add what you own so it can be watched'}</p></div>${edit ? `<a class="btn sm" href="${esc(edit)}" target="_blank" rel="noopener">Edit holdings</a>` : ''}</div>
    ${H.length ? `<div class="table-wrap"><table><thead><tr><th>Symbol</th><th>Advice</th><th class="r">Price</th><th class="r">P&amp;L</th><th class="r">Stop</th><th class="r">Target</th><th class="r">Days</th><th>Why</th></tr></thead><tbody>${H.map((h) => `<tr><td><b>${esc(h.symbol)}</b><div class="small muted">${esc(h.sleeve)}</div></td><td>${chip(h.advice)}</td><td class="r">${money(h.price)}</td><td class="r ${tone(h.pnl_pct)}">${pct(h.pnl_pct)}</td><td class="r">${money(h.stop)}</td><td class="r">${money(h.target)}</td><td class="r">${isNum(h.days_held) ? h.days_held : '—'}</td><td class="wrap">${(h.reasons || []).map(esc).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty">Open <code>portfolio.json</code> in your repository, add each holding with what you paid, and the next brief will watch it for you.</div>`}</section>`);

  const F = r.flashes || [];
  parts.push(`<section class="card"><div class="card-head"><div><h2>News flashes</h2><p>Stories that could change a decision</p></div></div>${F.length ? F.map((f) => `<div class="flash"><span class="sym">${esc(f.symbol)}</span><div class="grow">${chip(f.impact)} <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.headline)}</a><div class="small muted">${esc(f.source)} · ${esc(f.at)}</div>${f.why_it_matters ? `<div class="small">${esc(f.why_it_matters)}</div>` : ''}</div></div>`).join('') : '<div class="empty">Nothing notable in the news.</div>'}</section>`);

  const U = r.universe || {};
  const row = (u) => `<tr><td><b>${esc(u.symbol)}</b></td><td class="r">${money(u.price)}</td><td>${esc(u.trend || '—')}</td><td class="r">${isNum(u.rsi) ? u.rsi : '—'}</td><td class="r ${tone(u.d1)}">${pct(u.d1)}</td><td class="r ${tone(u.m1)}">${pct(u.m1)}</td><td class="wrap">${esc(u.setup)}</td><td class="r">${u.news || 0}</td></tr>`;
  parts.push(`<section class="card"><details><summary>Everything being watched (${(U.long || []).length} stocks, ${(U.short || []).length} crypto)</summary><div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>Symbol</th><th class="r">Price</th><th>Trend</th><th class="r">RSI</th><th class="r">Day</th><th class="r">Month</th><th>Read</th><th class="r">News</th></tr></thead><tbody>${[...(U.long || []), ...(U.short || [])].map(row).join('')}</tbody></table></div></details></section>`);

  $('#main').innerHTML = `<div class="stack">${parts.join('')}</div>`;
}

async function loadJson(path) {
  const res = await fetch(path + (path.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.json();
}

async function init() {
  document.addEventListener('click', (ev) => {
    const d = ev.target.closest('[data-dismiss]');
    if (d) { const list = store.get('advisor.dismissed') || []; list.push(d.dataset.dismiss); store.set('advisor.dismissed', list.slice(-200)); render(current); }
  });
  document.addEventListener('change', (ev) => {
    const t = ev.target.closest('[data-todo]');
    if (t && current) { const key = 'advisor.todo.' + current.date_et + '.' + current.run; const set = new Set(store.get(key) || []); const i = +t.dataset.todo; t.checked ? set.add(i) : set.delete(i); store.set(key, [...set]); t.nextElementSibling.classList.toggle('done', t.checked); }
    if (ev.target.id === 'history') loadJson('data/history/' + ev.target.value).then(render).catch((e) => { $('#main').innerHTML = `<div class="card empty">Couldn't load that brief (${esc(e.message)}).</div>`; });
  });
  try {
    const idx = await loadJson('data/index.json');
    const sel = $('#history');
    sel.innerHTML = (idx.reports || []).map((n) => `<option value="${esc(n)}">${esc(n.replace('.json', '').replace(/-(\w+)$/, ' $1'))}</option>`).join('');
    render(await loadJson('data/latest.json'));
  } catch (e) {
    $('#main').innerHTML = `<div class="card empty">No brief yet. The first one appears after the advisor's first run (Actions → Market advisor → Run workflow).<div class="small muted" style="margin-top:6px">${esc(e.message)}</div></div>`;
    $('#sub').textContent = 'Waiting for the first brief';
  }
}
init();
</script>
</body>
</html>
