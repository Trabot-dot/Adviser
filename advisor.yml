name: Market advisor

on:
  schedule:
    # UTC. 06:45 = 07:45 UK in summer (06:45 in winter): the morning brief, every day (crypto trades weekends).
    - cron: "45 6 * * *"
    # 15:30 = one hour after the US open (16:30 UK summer): midday check, weekdays.
    - cron: "30 15 * * 1-5"
    # 19:45 = 15 minutes before the US close (20:45 UK summer): evening check, weekdays.
    - cron: "45 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: advisor
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Write the brief
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python advisor.py

      - name: Publish to the website
        if: always()
        run: |
          git config user.name "market-advisor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
          else
            git commit -m "Brief $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
